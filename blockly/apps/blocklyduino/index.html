<!DOCTYPE html>
<html manifest="node.manifest">
<head>
  <meta charset="utf-8">
  <title>BlocklyDuino</title>
  <script type="text/javascript" src="../../blockly_compressed.js"></script>
  <script type="text/javascript" src="../../blocks_compressed.js"></script>
  <script type="text/javascript" src="../../arduino_compressed.js"></script>
  <script type="text/javascript" src="../../msg/js/en.js"></script>
  <script type="text/javascript" src="Blob.js"></script>
  <script type="text/javascript" src="spin.js"></script>
  <script type="text/javascript" src="FileSaver.min.js"></script>
  <script type="text/javascript" src="blockly_helper.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
      background-color: #f5f5f5;
    }
    h1 {
      font-weight: normal;
      font-size: 140%;
      margin: 5px;
    }
    /* Container */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
      margin: 0;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    button.upload-btn {
      width: 86px; 
      height: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;  
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button.upload-btn:hover {
      background-color: #409144;
    }
    .button-row {
  display: flex;
  justify-content: space-between; /* Spread left and right buttons to each side */
  align-items: center; /* Vertically align buttons */
  padding: 0 10px; /* Add some horizontal padding for spacing */
}

.left-button {
  display: flex;
  justify-content: flex-start; /* Ensure Upload stays on the left */
}


.right-buttons {
  display: flex;
  justify-content: flex-end; /* Ensure Reset and Discard align on the right */
  gap: 5px; /* Add space between Reset and Discard buttons */
}

    button.reset-btn, button.discard-btn {
      width: 56px; 
      height: 22px;
      background-color: #FFA726;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button.reset-btn:hover, button.discard-btn:hover {
      background-color: #E18B0D;
    }
  button.save-xml-btn,
button.load-xml-btn {
  width: 88px;
  height: 26px;
  background-color: #5E7290;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}

button.save-xml-btn:hover,
button.load-xml-btn:hover {
  background-color: #364C6D;
}

    .workspace {
      grid-column: 1 / span 1;
      height: 95%;
      width: 100%;
      background: white;
      border: 1px solid #ccc;
      position: relative;
      box-sizing: border-box;
      overflow: auto;
    }
    .blocklySvg {
      width: 100% !important;
      height: 100% !important;
    }
    .blocklyMainBackground {
      fill: #f9f9f9;
    }
    .code-section {
      display: flex;
      flex-direction: column;
      height: 95%;
      gap: 10px;
      justify-content: space-between;
    }
    .code-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      margin-top: 50px; /* Space above the XML section */
    margin-bottom: 10px;
    }
    .code-box {
    margin-top: 5px; /* Add space above each code-box */
    margin-bottom: 10px; /* Add space below each code-box */
}
    .code-box textarea {
      flex: 1;
      resize: none;
      padding: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .code-box input#file_name {
      width: 200px;
      padding: 5px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button.save-code-btn {
    width: 85px; /* Adjust width as needed */
    height: 25px; /* Adjust height for alignment */
    background-color: #5E7290;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }

  button.save-code-btn:hover {
    background-color: #364C6D;
  }
  .back-home-btn {
      position: fixed;
      bottom: 10px; /* Distance from the bottom */
      right: 20px; /* Distance from the right */
      background-color: #FFA726; /* Green background */
      color: white;
      border: none;
      padding: 10px 10px;
      font-size: 10px;
      border-radius: 8px; /* Rounded corners */
      cursor: pointer;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
    }

    .back-home-btn:hover {
      background-color: #E18B0D; /* Slightly darker green on hover */
    }
  </style>
</head>
<body onload="init()">
  <div class="container">
    <!-- Top-Left Buttons -->
    <div class="top-left-buttons">
    </div>
    

    <!-- Blockly Workspace -->
    <div id="content_blocks" class="workspace"></div>
    

    <!-- Arduino Code and XML Panel -->
    <div class="code-section">
      <!-- Arduino Code Section -->
      <div class="code-box">
        <div class="button-row">
          <div class="left-button">
            <button type="button" class="upload-btn" onclick="uploadClick()">Upload</button>
          </div>
          <div class="right-buttons">
            <button type="button" class="reset-btn" onclick="resetClick()">Reset</button>
            <button type="button" class="discard-btn" onclick="discard()">Discard</button>
          </div>
        </div>
        

        <label>Arduino Code</label>
        <textarea id="content_arduino" readonly></textarea>
      </div>

      <!-- File Name and Save Section -->
      <div class="code-box">
        <label>File Name</label>
        <div class="file-name-section">
          <input type="text" id="file_name" placeholder="Enter file name here">
          <button class="save-code-btn" onclick="saveCode()">Save Code</button>
        </div>
      
      </div>
<!-- XML Section with Buttons on Top -->
<div class="code-box">
  <!-- Buttons at the Top -->
  <div style="display: flex; justify-content: flex-start; gap: 5px; margin-bottom: 5px;">
    <button class="save-xml-btn" onclick="saveXML()">Save XML</button>
    <button class="load-xml-btn" onclick="document.getElementById('load').click()">Load XML</button>
    <input type="file" id="load" style="display: none;" onchange="loadFile(event)">
  </div>
  
  <!-- XML Panel -->
  <label>XML</label>
  <textarea id="content_xml" readonly></textarea>
</div>
<!-- Back to Home Button -->
<button class="back-home-btn" onclick="location.href='home.html';">
  Back to Home
</button>


  <!-- Toolbox -->
  <xml id="toolbox" style="display: none">
    <category name="Logic">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_null"></block>
    </category>
    <category name="Control">
      <block type="base_delay">
        <value name="DELAY_TIME">
          <block type="math_number">
            <field name="NUM">1000</field>
          </block>
        </value>
      </block>
      <block type="controls_for">
        <value name="FROM">
          <block type="math_number">
            <field name="NUM">1</field>
          </block>
        </value>
        <value name="TO">
          <block type="math_number">
            <field name="NUM">10</field>
          </block>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="Math">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="base_map">
        <value name="DMAX">
          <block type="math_number">
            <field name="NUM">180</field>
          </block>
        </value>
      </block>
    </category>
    <category name="Text">
      <block type="text"></block>
    </category>
    <category name="Variables" custom="VARIABLE"></category>
    <category name="Functions" custom="PROCEDURE"></category>
    <sep></sep>
    <category name="Input/Output">
      <block type="inout_highlow"></block>
      <block type="inout_digital_write"></block>
      <block type="inout_digital_read"></block>
      <block type="inout_analog_write">
        <value name="NUM">
          <block type="math_number">
            <field name="NUM">0</field>
          </block>
        </value>
      </block>
      <block type="inout_analog_read"></block>
      <block type="serial_print">
        <value name="CONTENT">
          <block type="text">
            <field name="TEXT"></field>
          </block>
        </value>
      </block>
      <block type="inout_tone">
        <value name="NUM">
          <block type="math_number">
            <field name="NUM">440</field>
          </block>
        </value>
      </block>
      <block type="inout_notone"></block>
      <block type="inout_buildin_led"></block>
    </category>
    <category name="Servo">
      <block type="servo_move">
        <value name="DEGREE">
          <block type="math_number">
            <field name="NUM">0</field>
          </block>
        </value>
      </block>
      <block type="servo_read_degrees"></block>
    </category>
    <category name="Grove Analog">
      <block type="grove_rotary_angle"></block>
      <block type="grove_temporature_sensor"></block>
      <block type="grove_sound_sensor"></block>
      <block type="grove_thumb_joystick"></block>
    </category>
    <category name="Grove">
      <block type="grove_led"></block>
      <block type="grove_button"></block>
      <block type="grove_relay"></block>
      <block type="grove_tilt_switch"></block>
      <block type="grove_piezo_buzzer"></block>
      <block type="grove_pir_motion_sensor"></block>
      <block type="grove_line_finder"></block>
      <block type="grove_rgb_led"></block>
      <block type="grove_ultrasonic_ranger"></block>
    </category>
    <category name="Grove LCD">
      <block type="grove_serial_lcd_print">
        <value name="TEXT">
          <block type="text">
            <field name="TEXT"></field>
          </block>
        </value>
        <value name="TEXT2">
          <block type="text">
            <field name="TEXT"></field>
          </block>
        </value>
        <value name="DELAY_TIME">
          <block type="math_number">
            <field name="NUM">1000</field>
          </block>
        </value>
      </block>
      <block type="grove_serial_lcd_power"></block>
      <block type="grove_serial_lcd_effect"></block>
    </category>
    <category name="Grove Motor">
      <block type="grove_motor_shield"></block>
    </category>
  </xml>



  <script>
    function init() {
      var toolbox = document.getElementById('toolbox');
      Blockly.inject(document.getElementById('content_blocks'), {
        toolbox: toolbox,
        grid: { spacing: 25, length: 3, colour: '#ccc', snap: true }
      });
      Blockly.mainWorkspace.addChangeListener(function () {
        var arduinoCode = Blockly.Arduino.workspaceToCode();
        document.getElementById('content_arduino').value = arduinoCode;

        var xmlDom = Blockly.Xml.workspaceToDom(Blockly.mainWorkspace);
        var xmlText = Blockly.Xml.domToPrettyText(xmlDom);
        document.getElementById('content_xml').value = xmlText;
      });
    }

    function saveCode() {
      var code = document.getElementById('content_arduino').value;
      var blob = new Blob([code], { type: "text/plain;charset=utf-8" });
      saveAs(blob, "program.ino");
    }

    function saveXML() {
      var xmlText = document.getElementById('content_xml').value;
      var blob = new Blob([xmlText], { type: "text/plain;charset=utf-8" });
      saveAs(blob, "workspace.xml");
    }

    function loadFile(event) {
      var reader = new FileReader();
      reader.onload = function () {
        var xmlDom = Blockly.Xml.textToDom(reader.result);
        Blockly.mainWorkspace.clear();
        Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, xmlDom);
      };
      reader.readAsText(event.target.files[0]);
    }
  </script>
</body>
</html>
